    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* --- THEME ENGINE --- */
      :root {
        --color-background-start: #ffffff;
        --color-background-end: #f8fafc;
        --color-text-primary: #0f172a;
        --color-text-secondary: #64748b;
        --color-text-on-accent: #ffffff;
        --color-surface-primary: #ffffff;
        --color-surface-secondary: #f1f5f9;
        --color-surface-tertiary: #e2e8f0;
        --color-border: #e2e8f0;
        --color-accent-text: #2563eb;
        --color-accent-bg: #3b82f6;
        --color-accent-bg-hover: #2563eb;
        --color-accent-ring: #60a5fa;
        --color-accent-shadow: rgba(59, 130, 246, 0.4);
        --color-success-text: #15803d;
        --color-success-bg: #dcfce7;
        --color-success-border: #86efac;
        --color-danger-text: #b91c1c;
        --color-danger-bg: #fee2e2;
        --color-danger-border: #fca5a5;
        --color-warning-text: #b45309;
        --color-warning-bg: #fef3c7;
        --color-warning-bg-hover: #d97706;
        --color-scrollbar-track: #f1f5f9;
        --color-scrollbar-thumb: #cbd5e1;
        --color-scrollbar-thumb-hover: #94a3b8;
        /* Safe area insets for notched phones */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      .dark {
        --color-background-start: #020617;
        --color-background-end: #0f172a;
        --color-text-primary: #f8fafc;
        --color-text-secondary: #94a3b8;
        --color-text-on-accent: #ffffff;
        --color-surface-primary: #0f172a;
        --color-surface-secondary: #1e293b;
        --color-surface-tertiary: #334155;
        --color-border: #1e293b;
        --color-accent-text: #38bdf8;
        --color-accent-bg: #0ea5e9;
        --color-accent-bg-hover: #0284c7;
        --color-accent-ring: #38bdf8;
        --color-accent-shadow: rgba(14, 165, 233, 0.5);
        --color-success-text: #86efac;
        --color-success-bg: rgba(22, 163, 74, 0.15);
        --color-success-border: #15803d;
        --color-danger-text: #fca5a5;
        --color-danger-bg: rgba(185, 28, 28, 0.15);
        --color-danger-border: #991b1b;
        --color-warning-text: #fde047;
        --color-warning-bg: rgba(202, 138, 4, 0.15);
        --color-warning-bg-hover: #eab308;
        --color-scrollbar-track: #0f172a;
        --color-scrollbar-thumb: #334155;
        --color-scrollbar-thumb-hover: #475569;
      }

      /* ── Base & Reset ───────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }

      html, body, #root {
        height: 100%;
        /* Fill the full screen including safe areas on notched phones */
        min-height: 100dvh; /* dvh = dynamic viewport height — correct on mobile */
      }

      body {
        background-image: linear-gradient(to bottom right, var(--color-background-start), var(--color-background-end));
        color: var(--color-text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
        /* Prevent overscroll bounce on iOS */
        overscroll-behavior: none;
        /* Padding for iPhone notch/Dynamic Island */
        padding-top: var(--safe-top);
        padding-bottom: var(--safe-bottom);
        padding-left: var(--safe-left);
        padding-right: var(--safe-right);
      }

      /* ── Scrollbar ──────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--color-scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--color-scrollbar-thumb); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-thumb-hover); }

      /* ── Touch improvements ─────────────────────────────────────── */
      button, a, [role="button"] {
        /* Minimum 44×44px tap target on mobile (Apple HIG) */
        min-height: 36px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      /* Prevent text selection flicker on buttons */
      button { user-select: none; }

      /* ── Input improvements for mobile ──────────────────────────── */
      textarea, input[type="text"], input[type="password"], input[type="email"] {
        /* Prevent iOS auto-zoom on focus (needs font-size >= 16px) */
        font-size: 16px;
      }

      /* ── Animations ─────────────────────────────────────────────── */
      @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in { animation: fade-in 0.5s ease-out forwards; }
      @keyframes slide-in-bottom { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .slide-in-bottom { animation: slide-in-bottom 0.4s ease-out forwards; }
      @keyframes pulse-dot { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } }
      .pulse-1 { animation: pulse-dot 1.2s infinite ease-in-out; animation-delay: 0s; }
      .pulse-2 { animation: pulse-dot 1.2s infinite ease-in-out; animation-delay: 0.2s; }
      .pulse-3 { animation: pulse-dot 1.2s infinite ease-in-out; animation-delay: 0.4s; }
      @keyframes flash-highlight {
        0% { background-color: transparent; }
        50% { background-color: var(--color-success-bg); }
        100% { background-color: transparent; }
      }
      .flash-highlight { animation: flash-highlight 0.7s ease-out; }

      /* ── Table & Math Styling ───────────────────────────────────── */
      .prose .table-wrapper {
        overflow-x: auto;
        margin-top: 1.5em;
        margin-bottom: 1.5em;
        border: 1px solid var(--color-border);
        border-radius: 0.75rem;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      }
      .dark .prose .table-wrapper { box-shadow: none; }
      .prose table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.9em; margin: 0; }
      .prose th, .prose td { padding: 0.75rem 1rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--color-border); }
      .prose thead th {
        background-color: var(--color-surface-secondary);
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-text-secondary);
        border-bottom-width: 2px;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .dark .prose thead th { background-color: #283447; }
      .prose thead th:first-child { border-top-left-radius: 0.65rem; }
      .prose thead th:last-child { border-top-right-radius: 0.65rem; }
      .prose tbody tr:last-child td { border-bottom: none; }
      .prose tbody tr:last-child td:first-child { border-bottom-left-radius: 0.65rem; }
      .prose tbody tr:last-child td:last-child { border-bottom-right-radius: 0.65rem; }
      .prose tbody tr { transition: background-color 0.15s ease-in-out; }
      .prose tbody tr:hover { background-color: var(--color-surface-secondary); }
      .dark .prose tbody tr:hover { background-color: rgba(255, 255, 255, 0.035); }

      /* KaTeX font-size adjustment */
      .katex { font-size: 1.1em !important; }

      /* ── Mobile sidebar overlay ─────────────────────────────────── */
      @media (max-width: 768px) {
        /* Ensure fixed sidebars/navs sit above content */
        .mobile-sidebar { z-index: 50; }
      }
    </style>
    <script>
      // IIFE to set theme before React mounts — prevents Flash Of Unstyled Content
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
